# SonarCloud analysis configuration for VTcade.
#
# The projectKey and organization below are the values SonarCloud generates when
# you import this repository (Gr33nOps/VTcade) from GitHub. If SonarCloud shows
# different keys during import, edit these two lines to match, otherwise the scan
# will report "project not found".
sonar.projectKey=Gr33nOps_VTcade
sonar.organization=gr33nops
sonar.projectName=VTcade

# First-party code only. node_modules is vendored dependencies, never our code.
sonar.sources=BackEnd,FrontEnd
sonar.tests=BackEnd/tests,tests
sonar.exclusions=**/node_modules/**

sonar.sourceEncoding=UTF-8
