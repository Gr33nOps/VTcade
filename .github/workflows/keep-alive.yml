name: Supabase keep-alive

# Supabase pauses free-tier projects after 7 days with no database activity, and
# a paused project takes the whole site down until someone restores it by hand.
# This job makes a tiny authenticated read against the database on a schedule to
# keep database activity flowing through long stretches with no real visitors.
# See README > Deployment.
#
# Credentials come from repository secrets, set once with:
#   gh secret set SUPABASE_URL       --repo <owner>/<repo> --body "https://<ref>.supabase.co"
#   gh secret set SUPABASE_ANON_KEY  --repo <owner>/<repo> --body "<anon key>"
# The anon key is the same public key a browser would use; it is only ever
# allowed to read the already-public leaderboard, nothing else.

on:
  schedule:
    # Every fourth day at 07:13 UTC (at most 96 hours between runs). GitHub
    # Actions cron cannot represent exactly 100 hours, so this remains safely
    # inside that limit. The minute is offset from the top of the hour because
    # GitHub may defer scheduled jobs most heavily at :00.
    - cron: '13 7 */4 * *'
  # Lets you run it by hand from the Actions tab to confirm it works.
  workflow_dispatch: {}

# One ping at a time; never stack runs on top of each other.
concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ping:
    name: Ping Supabase
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL or SUPABASE_ANON_KEY secret is not set on this repo."
            exit 1
          fi

          # A single-row read is enough to count as database activity and reset
          # the idle timer. Retry a few times so a transient network blip does
          # not fail the run and leave a scary red X in the Actions history.
          code=""
          for attempt in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              --max-time 30 \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
              "$SUPABASE_URL/rest/v1/leaderboard?select=id&limit=1") || true
            echo "Attempt $attempt: HTTP $code"
            case "$code" in
              2*) echo "Supabase is awake."; exit 0 ;;
            esac

            # Some projects intentionally deny anonymous table reads through
            # RLS. The app's public leaderboard route performs the same small
            # read with its server-side credentials, so it is a safe fallback
            # that still creates real database activity without exposing any
            # additional key to the workflow or to visitors.
            app_code=$(curl -s -o /dev/null -w '%{http_code}' \
              --max-time 30 \
              https://vtcade.vercel.app/api/leaderboard) || true
            echo "Application fallback: HTTP $app_code"
            case "$app_code" in
              2*) echo "Supabase is awake via the application."; exit 0 ;;
            esac
            sleep 15
          done

          echo "::error::Keep-alive failed after 3 attempts (last HTTP ${code:-none})."
          exit 1
