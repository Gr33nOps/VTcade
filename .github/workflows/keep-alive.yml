name: Supabase keep-alive

# Supabase pauses free-tier projects after 7 days with no database activity, and
# a paused project takes the whole site down until someone restores it by hand.
# This job makes a tiny authenticated read against the database on a schedule so
# the project never crosses that idle window, even through long stretches with
# no real visitors. See README > Deployment.
#
# Credentials come from repository secrets, set once with:
#   gh secret set SUPABASE_URL       --repo <owner>/<repo> --body "https://<ref>.supabase.co"
#   gh secret set SUPABASE_ANON_KEY  --repo <owner>/<repo> --body "<anon key>"
# The anon key is the same public key a browser would use; it is only ever
# allowed to read the already-public leaderboard, nothing else.

on:
  schedule:
    # Mon, Wed and Fri at 07:13 UTC. Three pings a week keeps the largest gap
    # (Fri -> Mon, ~3 days) comfortably under Supabase's 7-day pause window, with
    # enough margin that even a skipped run still leaves days to spare. GitHub
    # defers scheduled jobs most at the top of the hour, so the minute is offset.
    - cron: '13 7 * * 1,3,5'
  # Lets you run it by hand from the Actions tab to confirm it works.
  workflow_dispatch: {}

# One ping at a time; never stack runs on top of each other.
concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ping:
    name: Ping Supabase
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL or SUPABASE_ANON_KEY secret is not set on this repo."
            exit 1
          fi

          # A single-row read is enough to count as database activity and reset
          # the idle timer. Retry a few times so a transient network blip does
          # not fail the run and leave a scary red X in the Actions history.
          code=""
          for attempt in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              --max-time 30 \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
              "$SUPABASE_URL/rest/v1/leaderboard?select=id&limit=1") || true
            echo "Attempt $attempt: HTTP $code"
            case "$code" in
              2*) echo "Supabase is awake."; exit 0 ;;
            esac
            sleep 15
          done

          echo "::error::Keep-alive failed after 3 attempts (last HTTP ${code:-none})."
          exit 1
