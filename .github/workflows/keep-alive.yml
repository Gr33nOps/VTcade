name: Supabase keep-alive

# Supabase pauses free-tier projects after 7 days with no database activity, and
# a paused project takes the whole site down until someone restores it by hand.
# This job makes a tiny authenticated read against the database on a schedule to
# keep database activity flowing through long stretches with no real visitors.
# See README > Deployment.
#
# Credentials come from repository secrets, set once with:
#   gh secret set SUPABASE_URL       --repo <owner>/<repo> --body "https://<ref>.supabase.co"
#   gh secret set SUPABASE_ANON_KEY  --repo <owner>/<repo> --body "<anon key>"
# The anon key is the same public key a browser would use; it is only ever
# allowed to read the already-public leaderboard, nothing else.

on:
  schedule:
    # Daily at 07:13 UTC. This gives several recovery opportunities before the
    # free-tier seven-day inactivity window, even if a runner or provider has a
    # short-lived network incident. The minute is offset from the top of the
    # hour because GitHub may defer scheduled jobs most heavily at :00.
    - cron: '13 7 * * *'
  # Lets you run it by hand from the Actions tab to confirm it works.
  workflow_dispatch: {}

# One ping at a time; never stack runs on top of each other.
concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ping:
    name: Ping Supabase
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL or SUPABASE_ANON_KEY secret is not set on this repo."
            exit 1
          fi

          # A one-row read counts as database activity. Check the application
          # route first because it uses the same server-side path as visitors.
          # Each route has its own curl retries and every round tries both, so
          # a temporary DNS, network, or deployment failure does not prevent a
          # successful database touch.
          request_code() {
            curl -sS -o /dev/null -w '%{http_code}' \
              --connect-timeout 15 \
              --max-time 45 \
              --retry 2 \
              --retry-delay 5 \
              --retry-all-errors \
              "$@" || true
          }

          app_code=""
          database_code=""
          for attempt in 1 2 3 4; do
            app_code=$(request_code https://vtcade.vercel.app/api/leaderboard)
            echo "Application attempt $attempt: HTTP ${app_code:-000}"
            case "$app_code" in
              2*) echo "Supabase is awake via the application."; exit 0 ;;
            esac

            database_code=$(request_code \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
              "$SUPABASE_URL/rest/v1/leaderboard?select=id&limit=1")
            echo "Database attempt $attempt: HTTP ${database_code:-000}"
            case "$database_code" in
              2*) echo "Supabase is awake."; exit 0 ;;
            esac

            sleep 30
          done

          echo "::error::Keep-alive failed after 4 rounds (app HTTP ${app_code:-000}; database HTTP ${database_code:-000})."
          exit 1
