<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="700" viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
    
    <!-- System Boundary -->
    <rect x="50" y="50" width="900" height="600" fill="none" stroke="#000" stroke-width="2"/>
    <text x="500" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#000">VTcade Gaming System</text>
    
    <!-- PLAYER SIDE -->

    <g transform="translate(200, 120)">
        <circle cx="50" cy="30" r="20" fill="none" stroke="#000" stroke-width="2"/>

        <line x1="50" y1="80" x2="80" y2="60" stroke="#000" stroke-width="2"/>

        <text x="50" y="220" text-anchor="middle" font-size="14" fill="#666">(Regular User)</text>
    </g>
    
    <!-- Player Use Cases -->
    <g transform="translate(100, 280)">
        <rect x="0" y="0" width="180" height="40" fill="none" stroke="#000" stroke-width="2" rx="2"/>

        <rect x="0" y="280" width="180" height="40" fill="none" stroke="#000" stroke-width="2" rx="2"/>
        <text x="90" y="305" text-anchor="middle" font-size="14" fill="#000">View Leaderboards</text>
        
        <rect x="0" y="350" width="180" height="40" fill="none" stroke="#000" stroke-width="2" rx="2"/>
        <text x="90" y="375" text-anchor="middle" font-size="14" fill="#000">Logout</text>
    </g>
    
    <!-- Player Connections -->

        <line x1="200" y1="140" x2="190" y2="300"/>
        <line x1="190" y1="300" x2="100" y2="300"/>
        
        <line x1="200" y1="140" x2="190" y2="370"/>
        <line x1="190" y1="370" x2="100" y2="370"/>
        
        <line x1="200" y1="140" x2="190" y2="440"/>
        <line x1="190" y1="440" x2="100" y2="440"/>
        
        <line x1="200" y1="140" x2="190" y2="510"/>
        <line x1="190" y1="510" x2="100" y2="510"/>
        
        <line x1="200" y1="140" x2="190" y2="580"/>

        <line x1="200" y1="140" x2="190" y2="650"/>
        <line x1="190" y1="650" x2="100" y2="650"/>

    <!-- ADMIN SIDE -->
    <!-- Admin Actor -->
    <g transform="translate(800, 120)">
        <circle cx="50" cy="30" r="20" fill="none" stroke="#000" stroke-width="2"/>
        <polygon points="40,15 50,5 60,15 55,20 45,20" fill="none" stroke="#000" stroke-width="1"/>
        <line x1="50" y1="50" x2="50" y2="120" stroke="#000" stroke-width="2"/>
        <line x1="50" y1="80" x2="20" y2="60" stroke="#000" stroke-width="2"/>
        <line x1="50" y1="80" x2="80" y2="60" stroke="#000" stroke-width="2"/>

        <text x="50" y="220" text-anchor="middle" font-size="14" fill="#666">(System Administrator)</text>
    </g>
    
    <!-- Admin Use Cases -->
    <g transform="translate(720, 280)">
        <rect x="0" y="0" width="180" height="40" fill="none" stroke="#000" stroke-width="2" rx="2"/>

        <rect x="0" y="210" width="180" height="40" fill="none" stroke="#000" stroke-width="2" rx="2"/>
        <text x="90" y="235" text-anchor="middle" font-size="14" fill="#000">View Statistics</text>
        
        <rect x="0" y="280" width="180" height="40" fill="none" stroke="#000" stroke-width="2" rx="2"/>
        <text x="90" y="305" text-anchor="middle" font-size="14" fill="#000">Manage System</text>
    </g>

        <line x1="810" y1="300" x2="900" y2="300"/>
        
        <line x1="800" y1="140" x2="810" y2="370"/>
        <line x1="810" y1="370" x2="900" y2="370"/>
        
        <line x1="800" y1="140" x2="810" y2="440"/>
        <line x1="810" y1="440" x2="900" y2="440"/>
        
        <line x1="800" y1="140" x2="810" y2="510"/>
        <line x1="810" y1="510" x2="900" y2="510"/>
        
        <line x1="800" y1="140" x2="810" y2="580"/>
        <line x1="810" y1="580" x2="900" y2="580"/>
    </g>
