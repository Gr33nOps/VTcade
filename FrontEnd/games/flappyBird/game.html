<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLAPPY BIRD</title>
    <meta name="description" content="Play Flappy Bird in the VTcade retro terminal arcade.">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#000000">
    <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="VTcade">
    <meta property="og:title" content="FLAPPY BIRD">
    <meta property="og:description" content="Play Flappy Bird in the VTcade retro terminal arcade.">
    <meta name="twitter:card" content="summary">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: black;
            color: #00ff00;
            font-family: "Courier New", monospace;
            font-size: 16px;
            line-height: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-shadow: 0 0 4px #00ff00;
            overflow: hidden;
            cursor: none;
            padding: 20px;
        }
        .container {
            display: flex;
            gap: 20px;
            z-index: 1;
        }
        pre {
            white-space: pre;
            user-select: none;
            line-height: 1.0;
        }
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                to bottom,
                rgba(0,0,0,0) 0px,
                rgba(0,255,0,0.04) 2px,
                rgba(0,0,0,0) 4px
            );
            pointer-events: none;
            z-index: 100;
        }
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: black;
            color: #00ff00;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            font-family: "Courier New", monospace;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .loading-overlay.active {
            opacity: 1;
            pointer-events: all;
        }
        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }
        .loading-dots::after {
            content: '';
            animation: dots 1.5s infinite;
        }
        @media (max-width: 768px) {
            body {
                font-size: 12px;
            }
            .container {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
<div class="loading-overlay active" id="loadingOverlay" role="status" aria-live="assertive" aria-label="Loading">
    <pre style="font-size: 14px; line-height: 1.5;">
FLAPPY BIRD v1.0

<span class="loading-dots">LOADING</span>
    </pre>
</div>
<div class="container">
    <pre id="game" role="img" aria-label="Game board rendered as text art"></pre>
    <pre id="ui" role="status" aria-live="polite"></pre>
</div>
<script src="../../shared/config.js"></script>
    <script src="../../shared/session.js"></script>
    <script src="../../shared/gameApi.js"></script>
    <script>
const gameEl = document.getElementById("game");
const uiEl = document.getElementById("ui");
const API_URL = VTSession.API_URL;
const WIDTH = 50;
const HEIGHT = 25;
const GAME_NAME = "FLAPPY BIRD";
const gameApi = createGameApi(GAME_NAME);

const currentUser = VTSession.getUsername();

if (!currentUser) {
    alert("You must be logged in to play!");
    // Was "../login/login.html", which resolves to games/login/login.html — a 404.
    window.location.replace("../../login/login.html");
    // Halt the rest of the script. Without this the redirect is merely queued
    // and initGame() still runs, firing requests for the literal user "null".
    throw new Error("Not authenticated");
}

let score = 0;
let highScore = 0;
let gameRunning = false;
let frameCount = 0;
let gameStarted = false;
// Incremented on every restart. gameOver() captures it before awaiting so a
// slow save can't repaint over a run the player has already restarted.
let runCounter = 0;
let wasPausedByHide = false;

let bird = {
    x: 10,
    y: Math.floor(HEIGHT / 2),
    velocity: 0,
    gravity: 0.5,
    jump: -2.5
};

let pipes = [];
const pipeWidth = 3;
const pipeGap = 8;
const pipeSpeed = 1;

let leaderboard = null; 

function draw() {
    let out = "";
    
    out += "+" + "=".repeat(WIDTH - 2) + "+\n";
    
    for (let y = 0; y < HEIGHT; y++) {
        let line = "|";
        for (let x = 1; x < WIDTH - 1; x++) {
            let ch = " ";
            
            if (Math.floor(bird.y) === y && x === bird.x) {
                ch = "█";
            }
            
            pipes.forEach(pipe => {
                if (x >= pipe.x && x < pipe.x + pipeWidth) {
                    if (y < pipe.topHeight || y >= HEIGHT - pipe.bottomHeight) {
                        ch = "▓";
                    }
                }
            });
            
            line += ch;
        }
        line += "|\n";
        out += line;
    }
    
    out += "+" + "=".repeat(WIDTH - 2) + "+\n";
    
    if (!gameStarted) {
        out += "< PRESS SPACE OR UP ARROW TO START >\n";
    } else if (!gameRunning && gameStarted) {
        out += "< GAME OVER >\nPRESS SPACE TO RESTART\n";
    }
    
    gameEl.textContent = out;
    
    let ui = `FLAPPY BIRD v1.0
━━━━━━━━━━━━━━━━━━━━

SCORE: ${score}
HIGHSCORE: ${highScore}

━━━━━━━━━━━━━━━━━━━━
LEADERBOARD:
━━━━━━━━━━━━━━━━━━━━
`;
    
    if (leaderboard === null) {
        ui += "(Loading...)\n";
    } else if (leaderboard.length === 0) {
        ui += "(No scores yet)\n(Be the first!)\n";
    } else {
        leaderboard.slice(0, 8).forEach((entry) => {
            const username = entry.username.substring(0, 12).padEnd(12);
            const displayScore = entry.score || 0;
            ui += `${entry.rank}. ${username} ${displayScore}\n`;
        });
    }
    
    ui += `\n━━━━━━━━━━━━━━━━━━━━
CONTROLS:
━━━━━━━━━━━━━━━━━━━━
SPACE / UP = FLAP
AVOID PIPES [▓]

━━━━━━━━━━━━━━━━━━━━
ESC = BACK TO HOME
`;
    
    uiEl.textContent = ui;
}

function gameLoop() {
    if (!gameRunning) return;
    
    updateBird();
    updatePipes();
    
    if (score > highScore) {
        highScore = score;
    }
    
    if (checkCollision()) {
        gameOver();
        return;
    }
    
    draw();
    setTimeout(gameLoop, 80);
}

function updateBird() {
    bird.velocity += bird.gravity;
    bird.y += bird.velocity;
    
    if (bird.y < 0) {
        bird.y = 0;
        bird.velocity = 0;
    }
}

function updatePipes() {
    frameCount++;
    
    if (frameCount % 40 === 0) {
        let topHeight = Math.floor(Math.random() * (HEIGHT - pipeGap - 4)) + 2;
        let bottomHeight = HEIGHT - pipeGap - topHeight;
        pipes.push({
            x: WIDTH - 2,
            topHeight,
            bottomHeight,
            passed: false
        });
    }
    
    pipes.forEach(pipe => {
        pipe.x -= pipeSpeed;
        if (pipe.x + pipeWidth < bird.x && !pipe.passed) {
            score++;
            pipe.passed = true;
        }
    });
    
    pipes = pipes.filter(pipe => pipe.x + pipeWidth > 1);
}

function checkCollision() {
    // Only the floor needs checking: updateBird() already clamps bird.y to >= 0,
    // so the old `|| bird.y < 0` ceiling test was unreachable.
    if (Math.floor(bird.y) >= HEIGHT) return true;

    return pipes.some(pipe => {
        if (bird.x >= pipe.x && bird.x < pipe.x + pipeWidth) {
            if (Math.floor(bird.y) < pipe.topHeight || 
                Math.floor(bird.y) >= HEIGHT - pipe.bottomHeight) {
                return true;
            }
        }
        return false;
    });
}

async function gameOver() {
    gameRunning = false;

    // Snapshot the score and which run it belongs to, before any awaiting.
    const finalScore = score;
    const runAtDeath = runCounter;

    // Paint GAME OVER immediately. The three calls below hit a free-tier
    // backend that can take seconds to wake up, and the player used to stare
    // at a frozen board that whole time with no sign the run had ended.
    draw();

    await saveHighscore(finalScore);
    await saveLeaderboard(finalScore);
    const freshLeaderboard = await gameApi.loadLeaderboard();

    // The player may already have restarted while those were in flight; don't
    // repaint a live game with stale end-of-run state.
    if (runCounter === runAtDeath) {
        leaderboard = freshLeaderboard;
        draw();
    }
}

function restartGame() {
    runCounter++;
    bird.y = Math.floor(HEIGHT / 2);
    bird.velocity = 0;
    pipes = [];
    score = 0;
    frameCount = 0;
    gameStarted = false;
    gameRunning = false;
    draw();
}

function startGame() {
    // Without this guard two rapid inputs could start two concurrent gameLoop()
    // timers, doubling the speed and firing gameOver() twice.
    if (gameRunning) return;
    gameRunning = true;
    gameStarted = true;
    gameLoop();
}

function jump() {
    if (!gameStarted) {
        startGame();
    } else if (gameRunning) {
        bird.velocity = bird.jump;
    } else {
        // Restart synchronously; the old deferred restart left a 100ms window
        // in which another input could start a second loop. This game binds
        // jump() to every click too, so a double-click hit it easily.
        restartGame();
        startGame();
    }
}

async function loadHighScore() {
    highScore = await gameApi.loadHighScore(currentUser);
}

async function saveHighscore(finalScore) {
    const stored = await gameApi.saveHighScore(finalScore);
    if (stored !== null) highScore = stored;
}

async function saveLeaderboard(finalScore) {
    await gameApi.saveLeaderboard(finalScore);
}

async function loadLeaderboard() {
    leaderboard = await gameApi.loadLeaderboard();
    draw();
}

document.addEventListener("keydown", (e) => {
    if (e.code === "Space" || e.code === "ArrowUp") {
        e.preventDefault();
        jump();
    } else if (e.code === "Escape") {
        e.preventDefault();
        document.getElementById('loadingOverlay').classList.add('active');
        setTimeout(() => {
            window.location.href = "../../dashboard/dashboard.html";
        }, 800);
    }
});

document.addEventListener("click", (e) => {
    jump();
});

// Pause when the tab is hidden. setTimeout-driven loops keep running in
// background tabs (throttled and jittery), which desynced the game and burned
// battery for a player who wasn't even looking.
document.addEventListener("visibilitychange", () => {
    if (document.hidden && gameRunning) {
        gameRunning = false;
        wasPausedByHide = true;
        draw();
    } else if (!document.hidden && wasPausedByHide) {
        wasPausedByHide = false;
        if (gameStarted) startGame();
    }
});

document.addEventListener("contextmenu", (e) => {
    e.preventDefault();
});

async function initGame() {
    try {
        await loadHighScore();
        await loadLeaderboard();
        restartGame();
    } catch (err) {
        restartGame();
    } finally {
        setTimeout(() => {
            document.getElementById('loadingOverlay').classList.remove('active');
        }, 500);
    }
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initGame);
} else {
    initGame();
}
</script>
</body>
</html>
