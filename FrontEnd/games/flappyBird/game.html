<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLAPPY BIRD</title>
    <meta name="description" content="Play Flappy Bird in the VTcade retro terminal arcade.">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#000000">
    <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="VTcade">
    <meta property="og:title" content="FLAPPY BIRD">
    <meta property="og:description" content="Play Flappy Bird in the VTcade retro terminal arcade.">
    <meta name="twitter:card" content="summary">
    <link rel="stylesheet" href="../../shared/game.css">
</head>
<body>
<div class="loading-overlay active" id="loadingOverlay" role="status" aria-live="assertive" aria-label="Loading">
    <pre style="font-size: 14px; line-height: 1.5;">
FLAPPY BIRD v1.0

<span class="loading-dots">LOADING</span>
    </pre>
</div>
<div class="container">
    <pre id="game" role="img" aria-label="Game board rendered as text art"></pre>
    <pre id="ui" role="status" aria-live="polite"></pre>
</div>
<script src="../../shared/config.js"></script>
    <script src="../../shared/session.js"></script>
    <script src="../../shared/gameApi.js"></script>
    <script src="../../shared/gameUI.js"></script>
    <script src="../../shared/sound.js"></script>
    <script>
const gameEl = document.getElementById("game");
const uiEl = document.getElementById("ui");
const API_URL = VTSession.API_URL;
const { GLYPH, STATE } = VTGameUI;
// The same 20 x 24 cell board Snake uses, which renders as a 384 px square.
VTGameUI.setBoard(20, 24);
const WIDTH = VTGameUI.cols();
const HEIGHT = VTGameUI.rows();
const X_MIN = 0;
const X_MAX = WIDTH - 1;
const GROUND_ROW = VTGameUI.groundRow();   // 23, the floor line
const SKY_ROWS = GROUND_ROW;               // rows 0..22 are flyable
const GAME_NAME = "FLAPPY BIRD";
const KEY_LABEL = "SPACE";
const gameApi = createGameApi(GAME_NAME);

const currentUser = VTSession.getUsername();

if (!currentUser) {
    // Said in the terminal rather than an OS alert box. This site has no cursor
    // and no other native chrome, so a system modal is jarring, and it blocks
    // the redirect until someone finds a button to click.
    document.getElementById("loadingOverlay").innerHTML =
        '<pre style="font-size: 14px; line-height: 1.5;">NOT SIGNED IN\n\n' +
        '<span class="loading-dots">RETURNING TO LOGIN</span>\n</pre>';
    // Was "../login/login.html", which resolves to games/login/login.html, a 404.
    setTimeout(() => { window.location.replace("../../login/login.html"); }, 900);
    // Halt the rest of the script. Without this the redirect is merely queued
    // and initGame() still runs, firing requests for the literal user "null".
    throw new Error("Not authenticated");
}

let score = 0;
let highScore = 0;
let gameRunning = false;
let gameStarted = false;
// Incremented on every restart. gameOver() captures it before awaiting so a
// slow save can't repaint over a run the player has already restarted.
let runCounter = 0;
let wasPausedByHide = false;
let paused = false;
let isNewRecord = false;
// The last frame drawn while nothing was intersecting. Shown on game
// over so the board never displays the sprite buried in the hazard.
let lastSafeGrid = null;
let pipesCleared = 0;
// Distance travelled since the last pipe, in columns, so difficulty scaling
// tightens the spacing instead of leaving it fixed.
let distanceSincePipe = 0;

let bird = {
    x: 4,
    // One cell, the same sprite size as a snake segment or a tetris block.
    // It was 2x2 cells, which looked right when a cell was one character but
    // came out 2.4 times wider than the old bird relative to the field.
    width: 1,
    height: 1,
    y: Math.floor(HEIGHT / 2),
    velocity: 0,
    // Scaled to the shorter sky: 23 flyable rows where there were 29, so the
    // same numbers would have sent the bird across the screen far faster.
    gravity: 0.4,
    jump: -2
};

let pipes = [];
const pipeWidth = 1;   // cells, ~5% of the field, as it always was
// Proportional to the playfield, never absolute, so resizing the board cannot
// quietly change the difficulty. Roughly 38% of the sky, which is what it has
// always been; a fixed number here has twice been left behind by a resize.
// Clearance above the bird has always been about 30% of the sky. The bird is
// one row tall now rather than two, so the gap itself is one smaller.
const pipeGap = Math.round(SKY_ROWS * 0.35);   // 8 at 23 rows
// Scaled down with every other horizontal distance: the field is 20 cells
// across where it used to be 48 characters, so the old numbers would have made
// the game more than twice as fast.
// A pipe is only redrawn when it crosses a whole cell, so the STEP has to
// divide evenly into 1 or the motion judders. 0.4 advanced after 2 ticks, then
// 3, then 3, then 2, which is exactly what "stuttery" looks like. 0.5 advances
// every 2 ticks, forever.
//
// So the step never changes, and difficulty comes from the tick instead. That
// keeps the motion perfectly even at every speed, which a changing step size
// cannot do: 0.6 and 0.7 both judder.
const PIPE_STEP = 0.5;             // cells per tick, fixed
const TICK_SLOWEST = 90;           // ms, at the start
const TICK_FASTEST = 60;           // ms, the cap
let tickMs = TICK_SLOWEST;
let nextPipeGap = 11;

let leaderboard = null; 

function currentState() {
    if (!gameStarted) return STATE.IDLE;
    if (gameRunning) return STATE.PLAYING;
    return paused ? STATE.PAUSED : STATE.GAME_OVER;
}

function buildGrid() {
    const grid = VTGameUI.createGrid();

    // A visible floor. The bird used to die at an invisible boundary below the
    // last drawn row, so the thing that killed you was off-screen.
    VTGameUI.paintGround(grid);

    pipes.forEach(pipe => {
        VTGameUI.paintRect(grid, pipe.x, 0, pipeWidth, pipe.topHeight, GLYPH.HAZARD, VTGameUI.ROLE.HAZARD);
        const bottomStart = pipe.topHeight + pipeGap;
        VTGameUI.paintRect(grid, pipe.x, bottomStart, pipeWidth, SKY_ROWS - bottomStart, GLYPH.HAZARD, VTGameUI.ROLE.HAZARD);
    });

    VTGameUI.paintRect(grid, bird.x, bird.y, bird.width, bird.height, GLYPH.PLAYER, VTGameUI.ROLE.PLAYER);

    return grid;
}

// Draws a grid. Pass one explicitly to render a frame other than the current
// positions, which is how the game over screen avoids showing the impact.
function draw(gridOverride) {
    const grid = gridOverride || buildGrid();

    gameEl.textContent = VTGameUI.frameBoard(
        grid,
        VTGameUI.statusLines(currentState(), KEY_LABEL, { newRecord: isNewRecord })
    );

    uiEl.textContent = VTGameUI.panel({
        title: GAME_NAME,
        stats: [
            { label: "SCORE",     value: score },
            { label: "HIGHSCORE", value: highScore },
            { label: "PIPES",     value: pipesCleared }
        ],
        leaderboard: leaderboard,
        controls: [
            "SPACE / UP / W = FLAP",
            "FLY THROUGH THE GAPS",
            "AVOID  [" + GLYPH.HAZARD + "]  PIPES"
        ]
    });
}

function gameLoop() {
    if (!gameRunning) return;

    const preY = bird.y;
    updateBird();
    updatePipes();

    if (checkCollision()) {
        // Gravity accumulates, so the bird can fall several rows in one tick.
        // Falling straight back to preY can leave a gap of multiple rows with
        // nothing touching, which looks like the run ended for no reason. Find
        // the exact row where it made contact instead.
        const contactY = VTGameUI.findContactPoint(preY, bird.y, (y) => {
            const saved = bird.y;
            bird.y = y;
            const hit = checkCollision();
            bird.y = saved;
            return hit;
        });
        // If a contact point was found, rebuild the frame at that exact,
        // non-colliding position. If not (rare: the pipe itself moved onto an
        // already-stationary bird this tick), do NOT rebuild, that would
        // paint the grid from the still-colliding position and reintroduce the
        // overlap. lastSafeGrid already holds the last tick that was clean.
        if (contactY !== null) {
            bird.y = contactY;
            lastSafeGrid = buildGrid();
        }
        gameOver();
        return;
    }

    lastSafeGrid = buildGrid();
    draw(lastSafeGrid);
    setTimeout(gameLoop, tickMs);
}

function updateBird() {
    bird.velocity += bird.gravity;
    bird.y += bird.velocity;

    if (bird.y < 0) {
        // Bonk. Previously velocity was zeroed here, so you could hold the top
        // edge indefinitely at no risk; now you bounce off and start falling.
        bird.y = 0;
        bird.velocity = 0.5;
    }
}

function updatePipes() {
    distanceSincePipe += PIPE_STEP;

    if (distanceSincePipe >= nextPipeGap) {
        distanceSincePipe = 0;
        nextPipeGap = 10 + Math.floor(Math.random() * 5);   // 10-14 cells, half the field
        // Leave at least one row of pipe above and below the gap.
        const maxTop = SKY_ROWS - pipeGap - 1;
        const topHeight = 1 + Math.floor(Math.random() * maxTop);
        pipes.push({ x: X_MAX, topHeight, passed: false });
    }

    pipes.forEach(pipe => {
        pipe.x -= PIPE_STEP;
        if (pipe.x + pipeWidth < bird.x && !pipe.passed) {
            score++;
            pipesCleared++;
            pipe.passed = true;
            VTSound.point();
            // Flappy was the only game with no difficulty curve at all. The
            // whole game speeds up rather than the pipes taking bigger jumps.
            if (score % 5 === 0 && tickMs > TICK_FASTEST) {
                tickMs = Math.max(TICK_FASTEST, tickMs - 3);
            }
        }
    });

    pipes = pipes.filter(pipe => pipe.x + pipeWidth > X_MIN);
}

function checkCollision() {
    const by = Math.floor(bird.y);

    // Resting on the floor is death, and the floor is now the drawn ground row.
    if (by + bird.height > SKY_ROWS) return true;

    return pipes.some(pipe => {
        // Measured in characters, through the same mapping paintRect uses.
        // Flooring the cell value instead let a pipe at a half cell position
        // render on top of the bird while this reported a miss.
        const pipeStart = VTGameUI.toChars(pipe.x);
        const pipeEnd = pipeStart + VTGameUI.toChars(pipeWidth);
        const birdStart = VTGameUI.toChars(bird.x);
        const birdEnd = birdStart + VTGameUI.toChars(bird.width);

        if (birdStart >= pipeEnd || birdEnd <= pipeStart) return false;

        const gapTop = pipe.topHeight;
        const gapBottom = pipe.topHeight + pipeGap;   // exclusive
        // Every row the bird occupies must sit inside the gap.
        return by < gapTop || by + bird.height > gapBottom;
    });
}

async function gameOver() {
    gameRunning = false;

    // Snapshot the score and which run it belongs to, before any awaiting.
    const finalScore = score;
    const runAtDeath = runCounter;

    // Compare against the best we knew *before* the save overwrites it.
    isNewRecord = finalScore > highScore;

    if (isNewRecord && finalScore > 0) VTSound.newRecord(); else VTSound.gameOver();

    // Paint GAME OVER immediately: the three calls below hit a free-tier
    // backend that can take seconds to wake, and the player used to stare at a
    // frozen board with no sign the run had ended.
    //
    // Render the last non-intersecting frame rather than the current positions.
    // By the time a collision is detected the sprite has already moved into the
    // hazard, so drawing it now would show it buried inside the obstacle.
    draw(lastSafeGrid);

    await saveHighscore(finalScore);
    await saveLeaderboard(finalScore);
    const freshLeaderboard = await gameApi.loadLeaderboard();

    // The player may already have restarted while those were in flight; don't
    // repaint a live game with stale end-of-run state.
    if (runCounter === runAtDeath) {
        leaderboard = freshLeaderboard;
        draw(lastSafeGrid);
    }
}

function restartGame() {
    runCounter++;
    paused = false;
    isNewRecord = false;
    lastSafeGrid = null;
    bird.y = Math.floor(SKY_ROWS / 2);
    bird.velocity = 0;
    pipes = [];
    score = 0;
    pipesCleared = 0;
    tickMs = TICK_SLOWEST;
    distanceSincePipe = 0;
    nextPipeGap = 11;
    gameStarted = false;
    gameRunning = false;
    draw();
}

function startGame() {
    // Without this guard two rapid inputs could start two concurrent gameLoop()
    // timers, doubling the speed and firing gameOver() twice.
    if (gameRunning) return;
    VTSound.start();
    gameRunning = true;
    gameStarted = true;
    gameLoop();
}

function togglePause() {
    if (!gameStarted) return;
    if (paused) {
        paused = false;
        gameRunning = true;
        gameLoop();
        return;
    }
    if (!gameRunning) return;   // already over, nothing to pause
    paused = true;
    gameRunning = false;
    draw();
}

function jump() {
    if (paused) return;

    if (!gameStarted) {
        startGame();
    } else if (gameRunning) {
        bird.velocity = bird.jump;
        VTSound.flap();
    } else {
        // Restart synchronously; the old deferred restart left a 100ms window
        // in which another input could start a second loop. This game binds
        // jump() to every click too, so a double-click hit it easily.
        restartGame();
        startGame();
    }
}

async function loadHighScore() {
    highScore = await gameApi.loadHighScore(currentUser);
}

async function saveHighscore(finalScore) {
    const stored = await gameApi.saveHighScore(finalScore);
    if (stored !== null) highScore = stored;
}

async function saveLeaderboard(finalScore) {
    await gameApi.saveLeaderboard(finalScore);
}

async function loadLeaderboard() {
    leaderboard = await gameApi.loadLeaderboard();
    draw();
}

document.addEventListener("keydown", (e) => {
    if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") {
        e.preventDefault();
        jump();
    } else if (e.code === "KeyP") {
        e.preventDefault();
        togglePause();
    } else if (e.code === "KeyM") {
        e.preventDefault();
        VTSound.toggleMute();
        draw();
    } else if (e.code === "Escape") {
        e.preventDefault();
        VTSound.back();
        document.getElementById('loadingOverlay').classList.add('active');
        setTimeout(() => {
            window.location.href = "../../dashboard/dashboard.html";
        }, 300);
    }
});

// No click handler on purpose. The whole site is keyboard-driven and renders
// with `cursor: none`, so an invisible pointer that could flap made this the
// one place the mouse did anything. Snake and Tetris were already keyboard
// only; all three now match.

// Pause when the tab is hidden. setTimeout-driven loops keep running in
// background tabs (throttled and jittery), which desynced the game and burned
// battery for a player who wasn't even looking.
document.addEventListener("visibilitychange", () => {
    if (document.hidden && gameRunning) {
        gameRunning = false;
        wasPausedByHide = true;
        draw();
    } else if (!document.hidden && wasPausedByHide) {
        wasPausedByHide = false;
        // Don't auto-resume a game the player paused on purpose.
        if (gameStarted && !paused) startGame();
    }
});

document.addEventListener("contextmenu", (e) => {
    e.preventDefault();
});

async function initGame() {
    try {
        await loadHighScore();
        await loadLeaderboard();
        restartGame();
    } catch (err) {
        restartGame();
    } finally {
        setTimeout(() => {
            document.getElementById('loadingOverlay').classList.remove('active');
        }, 500);
    }
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initGame);
} else {
    initGame();
}
</script>
</body>
</html>
