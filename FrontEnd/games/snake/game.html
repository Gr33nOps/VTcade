<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNAKE</title>
    <meta name="description" content="Play Snake in the VTcade retro terminal arcade.">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#000000">
    <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="VTcade">
    <meta property="og:title" content="SNAKE">
    <meta property="og:description" content="Play Snake in the VTcade retro terminal arcade.">
    <meta name="twitter:card" content="summary">
    <link rel="stylesheet" href="../../shared/game.css">
</head>
<body>
<div class="loading-overlay active" id="loadingOverlay" role="status" aria-live="assertive" aria-label="Loading">
    <pre style="font-size: 14px; line-height: 1.5;">
SNAKE v1.0

<span class="loading-dots">LOADING</span>
    </pre>
</div>
<div class="container">
    <pre id="game" role="img" aria-label="Game board rendered as text art"></pre>
    <pre id="ui" role="status" aria-live="polite"></pre>
</div>
<script src="../../shared/config.js"></script>
    <script src="../../shared/session.js"></script>
    <script src="../../shared/gameApi.js"></script>
    <script src="../../shared/gameUI.js"></script>
    <script src="../../shared/sound.js"></script>
    <script>
const gameEl = document.getElementById("game");
const uiEl = document.getElementById("ui");
const API_URL = VTSession.API_URL;
const { GLYPH, STATE } = VTGameUI;
// A wide open field, in cells. Every sprite here is exactly one cell.
// 20 x 24 cells is 384 x 384 px on screen: a cell is 1.2 times wider than it
// is tall, so the board needs 5 cells across for every 6 down to come out
// square. 24 x 24 would render 1.20 wide.
VTGameUI.setBoard(20, 24);
const WIDTH = VTGameUI.cols();
const HEIGHT = VTGameUI.rows();
const X_MIN = 0;
const X_MAX = WIDTH - 1;
const GAME_NAME = "SNAKE";
const KEY_LABEL = "ARROW KEYS";
const gameApi = createGameApi(GAME_NAME);

const currentUser = VTSession.getUsername();

if (!currentUser) {
    // Said in the terminal rather than an OS alert box. This site has no cursor
    // and no other native chrome, so a system modal is jarring, and it blocks
    // the redirect until someone finds a button to click.
    document.getElementById("loadingOverlay").innerHTML =
        '<pre style="font-size: 14px; line-height: 1.5;">NOT SIGNED IN\n\n' +
        '<span class="loading-dots">RETURNING TO LOGIN</span>\n</pre>';
    setTimeout(() => { window.location.replace("../../login/login.html"); }, 900);
    // Halt the rest of the script. Without this the redirect is merely queued
    // and initGame() still runs, firing requests for the literal user "null".
    throw new Error("Not authenticated");
}

let score = 0;
let highScore = 0;
let gameRunning = false;
let gameStarted = false;
// Incremented on every restart. gameOver() captures it before awaiting so a
// slow save can't repaint over a run the player has already restarted.
let runCounter = 0;
let wasPausedByHide = false;
let paused = false;
let isNewRecord = false;
// The last frame drawn while nothing was intersecting. Shown on game
// over so the board never displays the sprite buried in the hazard.
let lastSafeGrid = null;
let speed = 150;
let snake = [];
let direction = { x: 1, y: 0 };
let nextDirection = { x: 1, y: 0 };
let food = { x: 0, y: 0 };
let leaderboard = null;

function initSnake() {
    snake = [
        { x: Math.floor(WIDTH / 2), y: Math.floor(HEIGHT / 2) },
        { x: Math.floor(WIDTH / 2) - 1, y: Math.floor(HEIGHT / 2) },
        { x: Math.floor(WIDTH / 2) - 2, y: Math.floor(HEIGHT / 2) }
    ];
    direction = { x: 1, y: 0 };
    nextDirection = { x: 1, y: 0 };
}

function spawnFood() {
    // Random probing is fine while the board is mostly empty, but it degrades
    // (and, on a full board, never terminates) as the snake grows. Fall back to
    // scanning the free cells once random attempts stop paying off.
    const MAX_ATTEMPTS = 100;

    for (let i = 0; i < MAX_ATTEMPTS; i++) {
        const x = Math.floor(Math.random() * (X_MAX - X_MIN + 1)) + X_MIN;
        const y = Math.floor(Math.random() * HEIGHT);
        if (!snake.some(s => s.x === x && s.y === y)) {
            food.x = x;
            food.y = y;
            return;
        }
    }

    const freeCells = [];
    for (let y = 0; y < HEIGHT; y++) {
        for (let x = X_MIN; x <= X_MAX; x++) {
            if (!snake.some(s => s.x === x && s.y === y)) freeCells.push({ x, y });
        }
    }

    if (freeCells.length === 0) {
        // Board is completely full, the player has won; leave food where it is.
        return;
    }

    const cell = freeCells[Math.floor(Math.random() * freeCells.length)];
    food.x = cell.x;
    food.y = cell.y;
}

function currentState() {
    if (!gameStarted) return STATE.IDLE;
    if (gameRunning) return STATE.PLAYING;
    return paused ? STATE.PAUSED : STATE.GAME_OVER;
}

function buildGrid() {
    const grid = VTGameUI.createGrid();

    // Painted through paintRect so the shared overlap guard sees these cells
    // too. Food is drawn first; spawnFood() never places it on the snake, so
    // the guard should never report a conflict here.
    VTGameUI.paintRect(grid, food.x, food.y, 1, 1, GLYPH.PICKUP, VTGameUI.ROLE.PICKUP);
    snake.forEach(seg => {
        VTGameUI.paintRect(grid, seg.x, seg.y, 1, 1, GLYPH.PLAYER, VTGameUI.ROLE.PLAYER);
    });

    return grid;
}

// Draws a grid. Pass one explicitly to render a frame other than the current
// positions, which is how the game over screen avoids showing the impact.
function draw(gridOverride) {
    const grid = gridOverride || buildGrid();

    gameEl.textContent = VTGameUI.frameBoard(
        grid,
        VTGameUI.statusLines(currentState(), KEY_LABEL, { newRecord: isNewRecord })
    );

    uiEl.textContent = VTGameUI.panel({
        title: GAME_NAME,
        stats: [
            { label: "SCORE",     value: score },
            { label: "HIGHSCORE", value: highScore },
            { label: "LENGTH",    value: snake.length }
        ],
        leaderboard: leaderboard,
        controls: [
            "ARROWS / WASD = MOVE",
            "EAT  [" + GLYPH.PICKUP + "]  TO GROW",
            "AVOID WALLS & SELF"
        ]
    });
}

function gameLoop() {
    if (!gameRunning) return;
    
    updateSnake();
    
    if (checkCollision()) {
        gameOver();
        return;
    }
    
    lastSafeGrid = buildGrid();
    draw(lastSafeGrid);
    setTimeout(gameLoop, speed);
}

function updateSnake() {
    direction = nextDirection;
    
    const head = { 
        x: snake[0].x + direction.x, 
        y: snake[0].y + direction.y 
    };
    
    snake.unshift(head);
    
    if (head.x === food.x && head.y === food.y) {
        // One flat point per pellet, matching Tetris (1 per line) and Flappy
        // (1 per pipe): every game now pays the same fixed amount per unit of
        // success, nothing scaled or bonused.
        score += 1;
        VTSound.eat();
        spawnFood();
        if (speed > 80) {
            speed -= 2;
        }
    } else {
        snake.pop();
    }
}

function checkCollision() {
    const head = snake[0];
    
    if (head.x < X_MIN || head.x > X_MAX || head.y < 0 || head.y >= HEIGHT) {
        return true;
    }
    
    for (let i = 1; i < snake.length; i++) {
        if (head.x === snake[i].x && head.y === snake[i].y) {
            return true;
        }
    }
    
    return false;
}

async function gameOver() {
    gameRunning = false;

    // Snapshot the score and which run it belongs to, before any awaiting.
    const finalScore = score;
    const runAtDeath = runCounter;

    // Compare against the best we knew *before* the save overwrites it.
    isNewRecord = finalScore > highScore;

    if (isNewRecord && finalScore > 0) VTSound.newRecord(); else VTSound.gameOver();

    // Paint GAME OVER immediately: the three calls below hit a free-tier
    // backend that can take seconds to wake, and the player used to stare at a
    // frozen board with no sign the run had ended.
    //
    // Render the last non-intersecting frame rather than the current positions.
    // By the time a collision is detected the sprite has already moved into the
    // hazard, so drawing it now would show it buried inside the obstacle.
    draw(lastSafeGrid);

    await saveHighscore(finalScore);
    await saveLeaderboard(finalScore);
    const freshLeaderboard = await gameApi.loadLeaderboard();

    // The player may already have restarted while those were in flight; don't
    // repaint a live game with stale end-of-run state.
    if (runCounter === runAtDeath) {
        leaderboard = freshLeaderboard;
        draw(lastSafeGrid);
    }
}

function restartGame() {
    runCounter++;
    paused = false;
    isNewRecord = false;
    lastSafeGrid = null;
    initSnake();
    spawnFood();
    score = 0;
    speed = 150;
    gameStarted = false;
    gameRunning = false;
    draw();
}

function startGame() {
    // Without this guard two rapid keypresses could start two concurrent
    // gameLoop() timers, doubling the speed and firing gameOver() twice.
    if (gameRunning) return;
    VTSound.start();
    gameRunning = true;
    gameStarted = true;
    gameLoop();
}

function togglePause() {
    if (!gameStarted) return;
    if (paused) {
        paused = false;
        gameRunning = true;
        gameLoop();
        return;
    }
    if (!gameRunning) return;   // already over, nothing to pause
    paused = true;
    gameRunning = false;
    draw();
}

function changeDirection(newDir) {
    if (paused) return;

    if (newDir.x === -direction.x && newDir.y === -direction.y) {
        return;
    }

    if (!gameStarted) {
        nextDirection = newDir;
        startGame();
    } else if (gameRunning) {
        nextDirection = newDir;
    } else {
        // Restart synchronously; the old deferred restart left a 100ms window
        // in which another keypress could start a second loop.
        restartGame();
        nextDirection = newDir;
        startGame();
    }
}

async function loadHighScore() {
    highScore = await gameApi.loadHighScore(currentUser);
}

async function saveHighscore(finalScore) {
    const stored = await gameApi.saveHighScore(finalScore);
    if (stored !== null) highScore = stored;
}

async function saveLeaderboard(finalScore) {
    await gameApi.saveLeaderboard(finalScore);
}

async function loadLeaderboard() {
    leaderboard = await gameApi.loadLeaderboard();
    draw();
}

document.addEventListener("keydown", (e) => {
    if (e.code === "ArrowUp" || e.code === "KeyW") {
        changeDirection({ x: 0, y: -1 });
        e.preventDefault();
    } else if (e.code === "ArrowDown" || e.code === "KeyS") {
        changeDirection({ x: 0, y: 1 });
        e.preventDefault();
    } else if (e.code === "ArrowLeft" || e.code === "KeyA") {
        changeDirection({ x: -1, y: 0 });
        e.preventDefault();
    } else if (e.code === "ArrowRight" || e.code === "KeyD") {
        changeDirection({ x: 1, y: 0 });
        e.preventDefault();
    } else if (e.code === "KeyP") {
        e.preventDefault();
        togglePause();
    } else if (e.code === "KeyM") {
        e.preventDefault();
        VTSound.toggleMute();
        draw();
    } else if (e.code === "Escape") {
        e.preventDefault();
        VTSound.back();
        document.getElementById('loadingOverlay').classList.add('active');
        setTimeout(() => {
            window.location.href = "../../dashboard/dashboard.html";
        }, 300);
    }
});

// Pause when the tab is hidden. setTimeout-driven loops keep running in
// background tabs (throttled and jittery), which desynced the game and burned
// battery for a player who wasn't even looking.
document.addEventListener("visibilitychange", () => {
    if (document.hidden && gameRunning) {
        gameRunning = false;
        wasPausedByHide = true;
        draw();
    } else if (!document.hidden && wasPausedByHide) {
        wasPausedByHide = false;
        // Don't auto-resume a game the player paused on purpose.
        if (gameStarted && !paused) startGame();
    }
});

document.addEventListener("contextmenu", (e) => {
    e.preventDefault();
});

async function initGame() {
    try {
        await loadHighScore();
        await loadLeaderboard();
        restartGame();
    } catch (err) {
        console.error('Error initializing game:', err);
        restartGame();
    } finally {
        setTimeout(() => {
            document.getElementById('loadingOverlay').classList.remove('active');
        }, 500);
    }
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initGame);
} else {
    initGame();
}
</script>
</body>
</html>
