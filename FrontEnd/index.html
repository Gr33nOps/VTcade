<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VTcade</title>
  <style>
    body {
      background: black;
      color: #00ff00;
      font-family: "Courier New", monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-shadow: 0 0 4px #00ff00;
    }
  </style>
</head>
<body>
  <p>Loading VTcade...</p>
  <script>
    // Previously a <meta refresh> straight to the dashboard, which then bounced
    // logged-out visitors back to login — two navigations and a visible flash.
    // Pick the right destination up front instead.
    var loggedIn = false;
    try {
      loggedIn = !!localStorage.getItem("currentUser");
    } catch (e) {
      // localStorage can throw when cookies/storage are blocked; treat as logged out.
    }
    window.location.replace(loggedIn ? "dashboard/dashboard.html" : "login/login.html");
  </script>
  <noscript>
    <p>JavaScript is required. <a href="login/login.html" style="color:#00ff00">Continue to login</a>.</p>
  </noscript>
</body>
</html>
